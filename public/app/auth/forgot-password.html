<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forgot password · ClassMate 9ja</title>
<meta name="theme-color" content="#008751">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<script>
  try {
    var t = JSON.parse(localStorage.getItem('cm9ja:theme') || 'null')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>

<main class="auth-main" style="min-height:100vh;align-items:flex-start;padding-top:var(--s-10)">
  <div class="auth-card">

    <a class="brand-mark" href="../index.html" style="margin-bottom:var(--s-8)">
      <span class="glyph">C</span>ClassMate&nbsp;<span class="naija">9ja</span>
    </a>

    <a class="row gap-2 t-sm fw-semibold muted" href="login.html" style="margin-bottom:var(--s-5)">
      <i data-icon="arrowL" data-size="16"></i> Back to log in
    </a>

    <h1 class="auth-title">Forgot your password?</h1>
    <p class="auth-sub">
      Enter the email on your account and we will send you a reset link.
    </p>

    <form id="forgotForm" novalidate class="stack gap-5">
      <div class="field">
        <label class="label" for="email">Email address</label>
        <div class="input-group">
          <span class="input-icon"><i data-icon="mail" data-size="18"></i></span>
          <input class="input" id="email" type="email" inputmode="email"
                 autocomplete="email" placeholder="you@school.ng">
        </div>
        <span class="hint">Demo account: student@classmate9ja.ng</span>
      </div>

      <p class="error-text hidden" id="formError" role="alert"></p>

      <button class="btn btn-primary btn-lg btn-block" type="submit">
        Send reset link
      </button>
    </form>

    <div class="alert alert-info" style="margin-top:var(--s-6)">
      <i data-icon="shield" data-size="18"></i>
      <span>
        We never ask for your password by email. Anybody who does is not from
        ClassMate 9ja.
      </span>
    </div>
  </div>
</main>

<script type="module" src="../js/pages/forgot-password.js"></script>
</body>
</html>

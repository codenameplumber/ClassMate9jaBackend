<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Verify code · ClassMate 9ja</title>
<meta name="theme-color" content="#008751">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<script>
  try {
    var t = JSON.parse(localStorage.getItem('cm9ja:theme') || 'null')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>

<main class="auth-main" style="min-height:100vh;align-items:flex-start;padding-top:var(--s-10)">
  <div class="auth-card">

    <a class="brand-mark" href="../index.html" style="margin-bottom:var(--s-8)">
      <span class="glyph">C</span>ClassMate&nbsp;<span class="naija">9ja</span>
    </a>

    <div class="steps" style="margin-bottom:var(--s-6)">
      <span class="dot is-done"></span>
      <span class="dot is-current"></span>
      <span class="dot"></span>
    </div>

    <a class="row gap-2 t-sm fw-semibold muted" href="forgot-password.html" style="margin-bottom:var(--s-5)">
      <i data-icon="arrowL" data-size="16"></i> Change number
    </a>

    <h1 class="auth-title">Enter the 6-digit code</h1>
    <p class="auth-sub">
      Sent by SMS to <b id="maskedPhone">0801 *** **78</b>. It expires in 10 minutes.
    </p>

    <!-- Offline demo: there is no SMS gateway, so we surface the code here.
         In production this whole block disappears. -->
    <div class="alert alert-warn" id="demoCode" style="margin-bottom:var(--s-5)">
      <i data-icon="info" data-size="18"></i>
      <span>Demo mode — your code is <b class="mono" id="codeValue">------</b></span>
    </div>

    <form id="otpForm" novalidate class="stack gap-5">
      <div class="otp" id="otpBoxes">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 1" autocomplete="one-time-code">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 2">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 3">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 4">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 5">
        <input type="text" inputmode="numeric" maxlength="1" aria-label="Digit 6">
      </div>

      <p class="error-text hidden center-text" id="formError" role="alert"></p>

      <button class="btn btn-primary btn-lg btn-block" type="submit">Verify code</button>
    </form>

    <p class="t-sm muted center-text" style="margin-top:var(--s-6)">
      Code never arrive?
      <button class="fw-semibold brand" id="resendBtn" disabled>Resend in <span id="countdown">45</span>s</button>
    </p>
  </div>
</main>

<script type="module" src="../js/pages/verify-otp.js"></script>
</body>
</html>

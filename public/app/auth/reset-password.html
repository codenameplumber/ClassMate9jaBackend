<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>New password · ClassMate 9ja</title>
<meta name="theme-color" content="#008751">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/components.css">
<link rel="stylesheet" href="../css/layout.css">
<script>
  try {
    var t = JSON.parse(localStorage.getItem('cm9ja:theme') || 'null')
      || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>

<main class="auth-main" style="min-height:100vh;align-items:flex-start;padding-top:var(--s-10)">
  <div class="auth-card">

    <a class="brand-mark" href="../index.html" style="margin-bottom:var(--s-8)">
      <span class="glyph">C</span>ClassMate&nbsp;<span class="naija">9ja</span>
    </a>

    <div class="steps" style="margin-bottom:var(--s-6)">
      <span class="dot is-done"></span>
      <span class="dot is-done"></span>
      <span class="dot is-current"></span>
    </div>

    <h1 class="auth-title">Set a new password</h1>
    <p class="auth-sub">Phone verified. Choose something you will remember.</p>

    <form id="resetForm" novalidate class="stack gap-5">

      <div class="field">
        <label class="label" for="password">New password</label>
        <div class="input-group has-action">
          <span class="input-icon"><i data-icon="lock" data-size="18"></i></span>
          <input class="input" id="password" type="password"
                 autocomplete="new-password" placeholder="At least 6 characters">
          <button class="input-action" type="button" id="togglePw"
                  aria-label="Show password"><i data-icon="eye" data-size="18"></i></button>
        </div>
      </div>

      <div class="field">
        <label class="label" for="confirm">Confirm new password</label>
        <div class="input-group">
          <span class="input-icon"><i data-icon="check" data-size="18"></i></span>
          <input class="input" id="confirm" type="password"
                 autocomplete="new-password" placeholder="Type it again">
        </div>
      </div>

      <p class="error-text hidden" id="formError" role="alert"></p>

      <button class="btn btn-primary btn-lg btn-block" type="submit">
        Save and log in
      </button>
    </form>

    <p class="t-sm muted center-text" style="margin-top:var(--s-6)">
      Remembered it? <a class="fw-semibold" href="login.html">Back to log in</a>
    </p>
  </div>
</main>

<script type="module" src="../js/pages/reset-password.js"></script>
</body>
</html>
